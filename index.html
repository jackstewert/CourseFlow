// LOGIN SCREEN
// ══════════════════════════════════════════════
function LoginScreen() {
  const [pw,      setPw]      = useState('');
  const [err,     setErr]     = useState('');
  const [loading, setLoading] = useState(false);

  const submit = async e => {
    e.preventDefault();
    if (!pw.trim()) return;
    setLoading(true); setErr('');
    try {
      if (!FB_OK) {
        localStorage.setItem('cf_pw', pw);
        bootApp(pw, loadData(), loadResume());
        return;
      }
      const db = getDb();
      let sentinel;
      try { sentinel = await db.collection('cf').doc('sentinel').get(); }
      catch(e) {
        const m = e.message || '';
        if (m.includes('ermission')) setErr('Firebase permissions error. Set Firestore rules to: allow read, write: if true;');
        else if (m.includes('roject') || m.includes('NOT_FOUND')) setErr('Firebase project not found. Check your config.');
        else setErr('Firebase error: ' + m);
        setLoading(false); return;
      }
      if (sentinel.exists) {
        try { await decrypt(sentinel.data().data, pw); }
        catch { setErr('Wrong password. Try again.'); setLoading(false); return; }
      }
      const [cloudData, cloudResume] = await Promise.all([cloudLoad('data', pw), cloudLoad('resume', pw)]);
      if (!sentinel.exists) await db.collection('cf').doc('sentinel').set({ data: await encrypt(JSON.stringify({ ok: true }), pw) });

      // Merge cloud + local: for each course, keep the one with the newer savedAt
      const local = loadData();
      let finalData;
      if (!cloudData) {
        finalData = local;
      } else {
        const localById = Object.fromEntries((local.courses || []).map(c => [c.id, c]));
        const merged = (cloudData.courses || []).map(cc => {
          const lc = localById[cc.id];
          if (!lc) return cc;
          return (lc.savedAt || 0) > (cc.savedAt || 0) ? lc : cc;
        });
        const cloudIds = new Set((cloudData.courses || []).map(c => c.id));
        const localOnly = (local.courses || []).filter(c => !cloudIds.has(c.id));
        finalData = { ...cloudData, courses: [...merged, ...localOnly] };
      }

      const finalResume = cloudResume ?? loadResume();
      localStorage.setItem('cf_pw', pw);
      saveData(finalData);
      saveResume(finalResume);
      bootApp(pw, finalData, finalResume);
    } catch(e) {
      setErr('Unexpected error: ' + (e.message || e));
      setLoading(false);
    }
  };

  return (
    <div className="login-wrap">
      <div className="login-card">
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 24 }}>
          <div className="login-logo">CF</div>
          <div>
            <div style={{ fontFamily: 'Syne,sans-serif', fontWeight: 800, fontSize: 19, letterSpacing: '-.3px' }}>CourseFlow</div>
            <div style={{ fontSize: 12, color: 'var(--t2)', marginTop: 1 }}>Enter your password to unlock</div>
          </div>
        </div>
        {!FB_OK && (
          <div style={{ background: 'rgba(246,201,14,.1)', border: '1px solid rgba(246,201,14,.25)', borderRadius: 8, padding: '9px 12px', marginBottom: 16, fontSize: 12, color: 'var(--yel)', lineHeight: 1.6 }}>
            ⚠️ Firebase not configured — running in local-only mode.
          </div>
        )}
        <form onSubmit={submit} style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
          <div className="fg">
            <label className="fl">Password</label>
            <input className="fi" type="password" autoFocus placeholder="Your secret password" value={pw} onChange={e => setPw(e.target.value)} />
          </div>
          {err && <div className="login-err">{err}</div>}
          <button className="btn btn-p" type="submit" disabled={loading || !pw.trim()} style={{ justifyContent: 'center', marginTop: 4 }}>
            {loading ? 'Unlocking…' : 'Unlock →'}
          </button>
        </form>
        <div className="login-note" style={{ marginTop: 16 }}>AES-256 encrypted before leaving this device.</div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════
// APP
// ══════════════════════════════════════════════
function App({ sessionPw, initialData, initialResume }) {
  const [data,       setDataState]  = useState(initialData);
  const [resumeMap,  setResumeState] = useState(initialResume);
  const [view,       setView]       = useState('home');
  const [filterCo,   setFilterCo]   = useState('all');
  const [chIdx,      setChIdx]      = useState(0);
  const [syncStatus, setSyncStatus] = useState('idle');
  const [mobChaps,   setMobChaps]   = useState(false);
  const [mobNotes,   setMobNotes]   = useState(false);
  const [triggerAdd, setTriggerAdd] = useState(false);
  const [triggerImp, setTriggerImp] = useState(false);

  const dataRef   = useRef(initialData);
  const resumeRef = useRef(initialResume);
  const syncMgr   = useRef(null);

  // Initialise SyncManager once
  useEffect(() => {
    const db = getDb();
    if (!FB_OK || !db) return;
    const mgr = new SyncManager(db, sessionPw, setSyncStatus);
    syncMgr.current = mgr;
    return () => mgr.destroy();
  }, [sessionPw]);

  // Online → retry immediately
  useEffect(() => {
    const h = () => syncMgr.current?.flush();
    window.addEventListener('online', h);
    return () => window.removeEventListener('online', h);
  }, []);

  // Firestore real-time listener (other devices)
  useEffect(() => {
    if (!FB_OK) return;
    const db = getDb(); if (!db) return;

    const unsub = db.collection('cf').doc('meta').onSnapshot(async snap => {
      if (!snap.exists) return;
      if (syncMgr.current?.isEcho()) return; // ← suppress our own writes echoing back

      try {
        const loaded = await cloudLoad('data', sessionPw);
        if (!loaded) return;

        // Functional update guarantees we have the latest local state
        setDataState(current => {
          const byId = Object.fromEntries((current.courses || []).map(c => [c.id, c]));
          const merged = (loaded.courses || []).map(cc => {
            const lc = byId[cc.id];
            if (!lc) return cc; // new from another device
            return (lc.savedAt || 0) >= (cc.savedAt || 0) ? lc : cc; // keep newer
          });
          const cloudIds = new Set((loaded.courses || []).map(c => c.id));
          const localOnly = (current.courses || []).filter(c => !cloudIds.has(c.id));
          const result = { ...loaded, courses: [...merged, ...localOnly] };
          dataRef.current = result;
          saveData(result);
          return result;
        });
      } catch {}
    });

    return () => unsub();
  }, [sessionPw]);

  // ── Data update: stamps savedAt, persists locally, schedules cloud sync
  const updateData = useCallback(newData => {
    const now = Date.now();
    const prevById = Object.fromEntries((dataRef.current.courses || []).map(c => [c.id, c]));
    const stamped = {
      ...newData,
      courses: (newData.courses || []).map(c => {
        const prev = prevById[c.id];
        if (!prev) return { ...c, savedAt: now }; // new course
        const changed = prev !== c; // identity check (we always use spread when mutating)
        return changed ? { ...c, savedAt: now } : c;
      }),
    };
    dataRef.current = stamped;
    setDataState(stamped);
    saveData(stamped);
    syncMgr.current?.schedule(stamped, resumeRef.current);
  }, []);

  const updateResume = useCallback(m => {
    resumeRef.current = m;
    setResumeState(m);
    saveResume(m);
    syncMgr.current?.schedule(dataRef.current, m);
  }, []);

  const goHome = useCallback(() => { setView('home'); setMobChaps(false); setMobNotes(false); }, []);

  const openCourse = useCallback((id, chapterIdx, fromNotes = false) => {
    const idx = chapterIdx !== undefined ? chapterIdx : (resumeRef.current[id] ?? 0);
    setChIdx(idx);
    const d = dataRef.current;
    const updated = { ...d, courses: d.courses.map(c => c.id === id ? { ...c, lastAccessed: Date.now() } : c) };
    dataRef.current = updated;
    setDataState(updated);
    saveData(updated);
    if (!fromNotes) {
      const nm = { ...resumeRef.current, [id]: idx };
      resumeRef.current = nm;
      setResumeState(nm);
      saveResume(nm);
      syncMgr.current?.schedule(updated, nm);
    } else {
      syncMgr.current?.schedule(updated, resumeRef.current);
    }
    setView(id);
  }, []);

  const lock = () => {
    syncMgr.current?.destroy();
    localStorage.removeItem('cf_pw');
    bootLogin();
  };

  const isCourse  = view !== 'home' && view !== 'notes';
  const sidebarCos = useMemo(() => data.companies.filter(co => data.courses.some(c => c.companyId === co.id)), [data]);
  const activeCo   = useMemo(() => isCourse ? data.courses.find(c => c.id === view)?.companyId : null, [isCourse, data, view]);

  const syncLabel = {
    idle:    FB_OK ? '☁ Synced' : '⚠ Local only',
    pending: '↑ Saving…',
    saving:  '↑ Saving…',
    saved:   '✓ Saved',
    offline: '⚡ Offline',
    error:   '↺ Retry',
  }[syncStatus] ?? '';

  return (
    <div className="layout">
      {/* Desktop sidebar */}
      <div className="sidebar">
        <div className="sb-logo" onClick={goHome} title="CourseFlow">CF</div>
        <div className="sb-div" />
        <div className={`sb-btn ${view === 'home' && filterCo === 'all' ? 'active' : ''}`} onClick={() => { setView('home'); setFilterCo('all'); }}>
          <span className="sb-ico">⬡</span><span className="sb-tip">All Courses</span>
        </div>
        <div className={`sb-btn ${view === 'notes' ? 'active' : ''}`} onClick={() => setView('notes')}>
          <span className="sb-ico">📓</span><span className="sb-tip">My Notes</span>
        </div>
        <div className="sb-div" />
        {sidebarCos.map(co => (
          <div key={co.id} className={`sb-btn ${activeCo === co.id || (view === 'home' && filterCo === co.id) ? 'active' : ''}`}
            onClick={() => { setView('home'); setFilterCo(co.id); }}>
            <CoIcon co={co} size={24} /><span className="sb-tip">{co.name}</span>
          </div>
        ))}
        <div style={{ flex: 1 }} />
        <div
          className={`sync-pill ${syncStatus}`}
          style={{ fontSize: 8, flexDirection: 'column', gap: 3, margin: '4px 0', cursor: syncStatus === 'error' ? 'pointer' : 'default' }}
          title={syncLabel}
          onClick={() => syncStatus === 'error' && syncMgr.current?.flush()}
        >
          <div className="sync-dot" />
        </div>
        <div className="sb-btn" onClick={lock} style={{ marginBottom: 6 }}>
          <span className="sb-ico">🔒</span><span className="sb-tip">Lock</span>
        </div>
      </div>

      {/* Main area */}
      <div className="main">
        {view === 'home' && (
          <HomePage data={data} onUpdate={updateData} onOpenCourse={openCourse}
            filterCo={filterCo} setFilterCo={setFilterCo} resumeMap={resumeMap}
            triggerAdd={triggerAdd} setTriggerAdd={setTriggerAdd}
            triggerImport={triggerImp} setTriggerImport={setTriggerImp} />
        )}
        {view === 'notes' && <NotesPage data={data} onOpenCourse={openCourse} />}
        {isCourse && (
          <CoursePage
            courseId={view} data={data} onUpdate={updateData} onBack={goHome}
            resumeMap={resumeMap} onResumeUpdate={updateResume}
            mobileChaptersOpen={mobChaps} setMobileChaptersOpen={setMobChaps}
            mobileNotesOpen={mobNotes}    setMobileNotesOpen={setMobNotes}
            initIdx={chIdx} onIdxChange={setChIdx} />
        )}
      </div>

      {/* Sync status + top-right chip (desktop, shown when active) */}
      {(syncStatus === 'saving' || syncStatus === 'saved' || syncStatus === 'error' || syncStatus === 'offline') && (
        <div style={{ position: 'fixed', top: 12, right: 16, zIndex: 900 }}
          className={`sync-pill ${syncStatus}`}
          onClick={() => syncStatus === 'error' && syncMgr.current?.flush()}
          style={{ position: 'fixed', top: 12, right: 16, zIndex: 900, cursor: syncStatus === 'error' ? 'pointer' : 'default', background: 'var(--bg4)', border: '1px solid var(--bd2)', padding: '4px 10px', borderRadius: 20, display: 'flex', alignItems: 'center', gap: 5, fontSize: 11.5, fontWeight: 600 }}>
          <div className="sync-dot" />
          {syncLabel}
        </div>
      )}

      {/* Mobile nav */}
      <nav className="mobile-nav">
        {isCourse ? (
          <>
            <button className="mn-btn" onClick={goHome}><span className="mn-ico">←</span><span>Home</span></button>
            <button className={`mn-btn ${mobChaps ? 'active' : ''}`} onClick={() => setMobChaps(v => !v)}><span className="mn-ico">☰</span><span>Chapters</span></button>
            <button className={`mn-btn ${mobNotes ? 'active' : ''}`} onClick={() => setMobNotes(v => !v)}><span className="mn-ico">📓</span><span>Notes</span></button>
            <button className="mn-btn" onClick={lock}><span className="mn-ico">🔒</span><span>Lock</span></button>
          </>
        ) : (
          <>
            <button className={`mn-btn ${view === 'home' ? 'active' : ''}`} onClick={goHome}><span className="mn-ico">⬡</span><span>Courses</span></button>
            <button className={`mn-btn ${view === 'notes' ? 'active' : ''}`} onClick={() => setView('notes')}><span className="mn-ico">📓</span><span>Notes</span></button>
            <button className="mn-btn" onClick={() => setTriggerAdd(true)}><span className="mn-ico">＋</span><span>Add</span></button>
            <button className="mn-btn" onClick={() => setTriggerImp(true)}><span className="mn-ico">📥</span><span>Import</span></button>
            <button className="mn-btn"
              style={{ color: syncStatus === 'error' || syncStatus === 'offline' ? 'var(--red)' : syncStatus === 'saved' ? 'var(--ac)' : 'var(--t3)' }}
              onClick={() => syncStatus === 'error' ? syncMgr.current?.flush() : downloadJson({ companies: data.companies, courses: data.courses }, `courseflow-${new Date().toISOString().slice(0, 10)}.json`)}>
              <span className="mn-ico">💾</span>
              <span>{syncStatus === 'saving' ? 'Sync…' : syncStatus === 'saved' ? 'Synced' : syncStatus === 'error' ? 'Retry' : syncStatus === 'offline' ? 'Offline' : 'Export'}</span>
            </button>
            <button className="mn-btn" onClick={lock}><span className="mn-ico">🔒</span><span>Lock</span></button>
          </>
        )}
      </nav>
    </div>
  );
}

// ══════════════════════════════════════════════
// BOOT
// ══════════════════════════════════════════════
const _root = ReactDOM.createRoot(document.getElementById('root'));
function bootLogin() { _root.render(<LoginScreen />); }
function bootApp(pw, data, resume) { _root.render(<App sessionPw={pw} initialData={data} initialResume={resume} />); }

const _pw = localStorage.getItem('cf_pw');
if (_pw) bootApp(_pw, loadData(), loadResume());
else bootLogin();
</script>
</body>
</html>
