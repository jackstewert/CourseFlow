<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080c18">
<title>CourseFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
:root{
  --bg:#080c18;--bg2:#0d1120;--bg3:#121929;--bg4:#18223a;--bg5:#1e2a42;
  --ac:#10e68c;--acd:#0cc87a;--acg:rgba(16,230,140,.1);--acg2:rgba(16,230,140,.06);
  --blue:#4f8ef7;--red:#f56565;--pur:#a78bfa;--yel:#f6c90e;
  --t1:#dce4f0;--t2:#7b8799;--t3:#3d4f66;
  --bd:#1a2740;--bd2:#223050;
  --r:12px;--r2:8px;--r3:6px;
  --sab:env(safe-area-inset-bottom);--sat:env(safe-area-inset-top);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--t1);-webkit-text-size-adjust:100%;position:fixed;inset:0}
#root{position:fixed;inset:0;display:flex;overflow:hidden}
::-webkit-scrollbar{width:3px;height:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}
::selection{background:var(--acg);color:var(--ac)}

/* ── Layout ─────────────────────────────── */
.layout{display:flex;width:100%;height:100%;overflow:hidden}
.sidebar{width:64px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;padding:14px 0 10px;gap:4px;z-index:20;overflow:hidden}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* ── Sidebar items ───────────────────────── */
.sb-logo{width:38px;height:38px;background:var(--ac);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:13px;color:#040810;cursor:pointer;flex-shrink:0;transition:transform .15s,box-shadow .15s;margin-bottom:10px;letter-spacing:-.5px}
.sb-logo:hover{transform:scale(1.06);box-shadow:0 0 20px rgba(16,230,140,.35)}
.sb-div{width:28px;height:1px;background:var(--bd);margin:6px 0;flex-shrink:0}
.sb-btn{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .12s,transform .12s;border:1.5px solid transparent;position:relative;flex-shrink:0}
.sb-btn:hover{background:var(--bg4)}
.sb-btn.active{background:var(--acg);border-color:rgba(16,230,140,.3)}
.sb-tip{position:absolute;left:52px;top:50%;transform:translateY(-50%);background:var(--bg4);color:var(--t1);font-size:11.5px;font-weight:500;padding:5px 10px;border-radius:7px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;border:1px solid var(--bd2);z-index:999}
.sb-btn:hover .sb-tip{opacity:1}
.sb-ico{font-size:17px;line-height:1}
.co-ico{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.sb-sync{width:6px;height:6px;border-radius:50%;margin:6px auto;flex-shrink:0;transition:background .3s}

/* ── Top bar ─────────────────────────────── */
.topbar{min-height:56px;background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:0 22px;flex-shrink:0;padding-top:var(--sat);position:relative}
.topbar-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;letter-spacing:-.3px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-title span{color:var(--ac)}
.sync-pill{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--t3);padding:3px 8px;border-radius:20px;transition:all .25s;user-select:none}
.sync-pill.saving{color:var(--yel)}
.sync-pill.saved{color:var(--ac)}
.sync-pill.error{color:var(--red);cursor:pointer}
.sync-pill.offline{color:var(--yel)}
.sync-dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.sync-pill.saving .sync-dot{animation:pulse .9s infinite}

/* ── Content area ───────────────────────── */
.content{flex:1;overflow-y:auto;padding:24px;-webkit-overflow-scrolling:touch}
@media(max-width:600px){.content{padding:14px}}

/* ── Buttons ─────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:var(--r2);font-size:13.5px;font-weight:600;cursor:pointer;border:none;transition:background .12s,transform .1s,box-shadow .12s;font-family:inherit;line-height:1;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--ac);color:#040810}
.btn-p:hover{background:var(--acd);box-shadow:0 0 16px rgba(16,230,140,.25)}
.btn-p:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn-s{background:transparent;color:var(--t2);border:1px solid var(--bd2)}
.btn-s:hover{background:var(--bg4);color:var(--t1);border-color:var(--bd2)}
.btn-d{background:transparent;color:var(--red);border:1px solid rgba(245,101,101,.25)}
.btn-d:hover{background:rgba(245,101,101,.08)}
.btn-sm{padding:7px 12px;font-size:12.5px}
.btn-xs{padding:5px 9px;font-size:11.5px}
.ib{width:34px;height:34px;border-radius:var(--r3);background:transparent;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;transition:background .12s,border-color .12s;flex-shrink:0;color:var(--t2)}
.ib:hover{background:var(--bg4);border-color:var(--bd2);color:var(--t1)}
.xb{width:32px;height:32px;border-radius:var(--r3);background:transparent;border:none;color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;transition:background .12s,color .12s}
.xb:hover{background:var(--bg4);color:var(--t1)}

/* ── Forms ───────────────────────────────── */
.fg{display:flex;flex-direction:column;gap:5px}
.fl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--t3)}
.fi,.fta,.fsel{background:var(--bg);border:1px solid var(--bd2);border-radius:var(--r2);color:var(--t1);font-family:inherit;font-size:14px;padding:9px 12px;outline:none;transition:border-color .12s,box-shadow .12s;width:100%;-webkit-appearance:none;appearance:none}
.fi:focus,.fta:focus,.fsel:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(16,230,140,.08)}
.fi::placeholder,.fta::placeholder{color:var(--t3)}
.fta{resize:vertical;min-height:80px;line-height:1.6}
.fsel{cursor:pointer}
.si-wrap{position:relative}
.si{padding-left:32px!important}
.si-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:13px;pointer-events:none}
.fi-hint{font-size:11px;color:var(--t3);line-height:1.5;margin-top:2px}

/* ── Tabs ─────────────────────────────────  */
.tabs{display:flex;gap:2px;background:var(--bg);border-radius:var(--r2);padding:3px;border:1px solid var(--bd)}
.tab{padding:6px 14px;border-radius:var(--r3);font-size:12.5px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--t2);transition:background .12s,color .12s;font-family:inherit;letter-spacing:.01em}
.tab.on{background:var(--bg4);color:var(--t1)}

/* ── Modal ───────────────────────────────── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal{background:var(--bg3);border-radius:var(--r);border:1px solid var(--bd2);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 32px 80px rgba(0,0,0,.7)}
.modal-hd{padding:18px 22px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0}
.modal-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:700}
.modal-body{padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.modal-foot{padding:14px 22px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:8px}

/* ── Chips / filter pills ───────────────── */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
.chip{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;cursor:pointer;border:1px solid var(--bd);background:var(--bg3);font-size:12px;font-weight:600;color:var(--t2);transition:all .12s;white-space:nowrap}
.chip:hover{border-color:var(--bd2);background:var(--bg4);color:var(--t1)}
.chip.on{border-color:rgba(16,230,140,.4);background:var(--acg);color:var(--ac)}

/* ── Sort row ───────────────────────────── */
.sort-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.sk{padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:600;cursor:pointer;border:1px solid var(--bd);background:transparent;color:var(--t2);transition:all .12s;font-family:inherit}
.sk.on{border-color:rgba(16,230,140,.4);color:var(--ac);background:var(--acg)}
.sk:hover:not(.on){background:var(--bg4);color:var(--t1)}

/* ── Course grid ────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:8px}
.sh-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;letter-spacing:-.4px}
.sh-count{font-size:12.5px;color:var(--t2);margin-left:7px;font-weight:500}

/* ── Course card ────────────────────────── */
.card{background:var(--bg3);border-radius:var(--r);border:1px solid var(--bd);cursor:pointer;transition:border-color .18s,transform .18s,box-shadow .18s;position:relative;overflow:hidden}
.card:hover{border-color:var(--bd2);transform:translateY(-2px);box-shadow:0 16px 48px rgba(0,0,0,.45)}
.card-thumb{width:100%;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.card-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .25s}
.card:hover .card-thumb img{transform:scale(1.04)}
.card-ph{width:100%;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font-size:38px;position:relative}
.card-badge{position:absolute;bottom:8px;right:8px;width:26px;height:26px;border-radius:5px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.card-resume{position:absolute;bottom:8px;left:8px;background:rgba(16,230,140,.92);color:#040810;font-size:10px;font-weight:800;padding:3px 8px;border-radius:5px;letter-spacing:.05em;backdrop-filter:blur(4px)}
.card-body{padding:13px 15px 15px}
.card-name{font-family:'Syne',sans-serif;font-size:14.5px;font-weight:700;line-height:1.35;margin-bottom:5px;letter-spacing:-.2px}
.card-desc{font-size:12px;color:var(--t2);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:11px}
.card-menu-btn{position:absolute;top:8px;left:8px;z-index:30}
.card-dropdown{position:absolute;top:34px;left:0;background:var(--bg4);border:1px solid var(--bd2);border-radius:10px;padding:5px;display:flex;flex-direction:column;gap:3px;min-width:130px;box-shadow:0 12px 36px rgba(0,0,0,.55);z-index:40}
.card-ddi{padding:7px 10px;border-radius:6px;font-size:12.5px;cursor:pointer;transition:background .1s;white-space:nowrap}
.card-ddi:hover{background:var(--bg5)}
.card-ddi.danger{color:var(--red)}
.g0{background:linear-gradient(135deg,#0d1e3d 0%,#092b1e 100%)}
.g1{background:linear-gradient(135deg,#1c0f35 0%,#110930 100%)}
.g2{background:linear-gradient(135deg,#2e0f0f 0%,#1a0808 100%)}
.g3{background:linear-gradient(135deg,#0c2918 0%,#071a10 100%)}
.g4{background:linear-gradient(135deg,#2a200a 0%,#1c1505 100%)}
.g5{background:linear-gradient(135deg,#0c1e2e 0%,#061420 100%)}

/* ── Progress bar ───────────────────────── */
.prog{margin-top:2px}
.prog-row{display:flex;justify-content:space-between;font-size:11px;color:var(--t3);margin-bottom:5px}
.prog-row span:last-child{color:var(--ac);font-weight:600}
.prog-track{height:3px;background:var(--bd);border-radius:10px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--ac),var(--acd));border-radius:10px;transition:width .4s cubic-bezier(.4,0,.2,1)}

/* ── Empty state ─────────────────────────── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:72px 24px;text-align:center;gap:14px}
.empty-ico{font-size:52px;opacity:.25;margin-bottom:4px}
.empty-title{font-family:'Syne',sans-serif;font-size:19px;font-weight:700;color:var(--t2)}
.empty-sub{font-size:13px;color:var(--t3);max-width:280px;line-height:1.65}

/* ── Course page ─────────────────────────── */
.course-layout{display:flex;height:100%;overflow:hidden}
.course-sidebar{width:272px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.course-sidebar-hd{padding:14px 14px 10px;border-bottom:1px solid var(--bd);flex-shrink:0}
.sidebar-label{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:8px}
.sidebar-course-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;line-height:1.4;margin-bottom:10px;color:var(--t1)}
.chapter-list{flex:1;overflow-y:auto;padding:6px 0;-webkit-overflow-scrolling:touch}
.sidebar-add{padding:8px 12px;border-top:1px solid var(--bd);flex-shrink:0}
.mod-header{padding:16px 16px 5px;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}
.mod-header:first-child{padding-top:10px}

/* ── Chapter row ─────────────────────────── */
.ch-row{display:flex;align-items:center;gap:10px;padding:9px 12px 9px 16px;cursor:pointer;transition:background .1s;border-left:2.5px solid transparent;min-width:0}
.ch-row:hover{background:var(--bg4)}
.ch-row.active{background:rgba(16,230,140,.07);border-left-color:var(--ac)}
.ch-row.done .ch-num{background:var(--ac);border-color:var(--ac);color:#040810}
.ch-num{width:26px;height:26px;border-radius:50%;background:var(--bg4);border:1.5px solid var(--bd2);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex-shrink:0;color:var(--t3);transition:all .15s}
.ch-row.active .ch-num{background:var(--ac);border-color:var(--ac);color:#040810}
.ch-info{flex:1;min-width:0}
.ch-name{font-size:12.5px;font-weight:600;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;transition:color .1s}
.ch-row.active .ch-name{color:var(--t1)}
.ch-meta{display:flex;align-items:center;gap:5px;margin-top:2px}
.ch-badge{font-size:9.5px;padding:2px 5px;border-radius:4px;font-weight:700;letter-spacing:.03em}
.ch-badge.video{background:rgba(79,142,247,.15);color:var(--blue)}
.ch-badge.text{background:rgba(167,139,250,.15);color:var(--pur)}
.ch-dur{font-size:10px;color:var(--t3)}
.ch-actions{display:flex;gap:3px;opacity:0;transition:opacity .1s;flex-shrink:0}
.ch-row:hover .ch-actions{opacity:1}

/* ── Course content ──────────────────────── */
.course-main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.course-topbar{min-height:52px;background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:8px 18px;flex-shrink:0;flex-wrap:wrap}
.course-topbar-title{flex:1;font-family:'Syne',sans-serif;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.course-body{flex:1;display:flex;overflow:hidden}
.course-content{flex:1;overflow-y:auto;padding:22px;-webkit-overflow-scrolling:touch}

/* ── Mark complete button ───────────────── */
.mark-btn{display:flex;align-items:center;gap:6px;cursor:pointer;flex-shrink:0;padding:7px 12px;border-radius:var(--r2);border:1.5px solid var(--bd2);background:transparent;color:var(--t2);font-size:12.5px;font-weight:600;font-family:inherit;transition:all .12s}
.mark-btn:hover{border-color:rgba(16,230,140,.4);color:var(--ac);background:var(--acg2)}
.mark-btn.done{border-color:rgba(16,230,140,.5);color:var(--ac);background:var(--acg)}
.mark-btn .cb{width:16px;height:16px;border-radius:4px;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:9px;transition:all .12s}
.mark-btn.done .cb{background:var(--ac);border-color:var(--ac);color:#040810}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3)}70%{transform:scale(.93)}100%{transform:scale(1)}}
.mark-btn.pop{animation:pop .3s ease}

/* ── Video ────────────────────────────────── */
.video-wrap{width:100%;aspect-ratio:16/9;background:#000;border-radius:var(--r);margin-bottom:18px;position:relative;overflow:hidden}
.video-wrap iframe,.video-wrap video{width:100%;height:100%;border:none;display:block}
.video-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--bg3);transition:opacity .3s}
.video-overlay.hide{opacity:0;pointer-events:none}
.video-spin{width:36px;height:36px;border-radius:50%;border:2.5px solid var(--bd2);border-top-color:var(--ac);animation:spin .65s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.video-none{width:100%;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:var(--bg3);border-radius:var(--r);color:var(--t3);font-size:13px;margin-bottom:18px;border:2px dashed var(--bd2)}

/* ── Content blocks ─────────────────────── */
.block{background:var(--bg3);border:1px solid var(--bd);border-radius:var(--r);padding:18px;margin-bottom:16px}
.block-title{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin-bottom:11px}
.block-text{font-size:13.5px;color:var(--t2);line-height:1.75;white-space:pre-wrap}
.link-list{display:flex;flex-direction:column;gap:5px}
.link-item{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--blue);padding:5px 0;text-decoration:none;transition:color .12s}
.link-item:hover{color:var(--ac)}
.file-list{display:flex;flex-direction:column;gap:7px}
.file-item{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--bg4);border-radius:var(--r2);border:1px solid var(--bd);text-decoration:none;color:inherit;transition:border-color .12s}
.file-item:hover{border-color:var(--bd2)}
.file-name{font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── Notes panel ─────────────────────────── */
.notes-panel{width:290px;flex-shrink:0;background:var(--bg3);border-left:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;transition:width .2s cubic-bezier(.4,0,.2,1)}
.notes-panel.hidden{width:0}
.notes-hd{padding:12px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:8px}
.notes-label{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--t3)}
.notes-ch-name{font-size:11px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.notes-body{flex:1;padding:10px;display:flex;flex-direction:column;overflow:hidden;gap:6px}
.notes-ta{width:100%;flex:1;background:var(--bg2);border:1px solid var(--bd2);border-radius:var(--r2);color:var(--t1);font-family:inherit;font-size:13.5px;line-height:1.7;padding:11px;outline:none;resize:none;transition:border-color .12s,box-shadow .12s;min-height:0}
.notes-ta:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(16,230,140,.06)}

  .sidebar{display:none!important}

  .topbar{padding:max(10px,var(--sat)) 14px 10px;gap:7px;min-height:50px}

  .overlay{padding:0;align-items:flex-end}
  .modal{max-width:100%;max-height:92vh;border-radius:18px 18px 0 0;padding-bottom:var(--sab)}

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ══════════════════════════════════════════════
// CONSTANTS
// ══════════════════════════════════════════════
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyCXKu18ONnWJx8Jt4zVBu1BEze68olXvNg",
  authDomain:        "courseflow-7e19f.firebaseapp.com",
  projectId:         "courseflow-7e19f",
  storageBucket:     "courseflow-7e19f.firebasestorage.app",
  messagingSenderId: "1042718851199",
  appId:             "1:1042718851199:web:852906be7d21cd1c0b3f4a",
};
const FB_OK = !FIREBASE_CONFIG.apiKey.startsWith('REPLACE');

const ACCENT_COLORS = ['#10e68c','#4f8ef7','#f56565','#f6c90e','#a78bfa','#fb923c'];
const META_KEY   = 'cf_meta_v2';
const COURSE_PFX = 'cf_c_';
const RESUME_KEY = 'cf_resume';
const SORTS = [
  { k: 'recent',   l: '⏱ Recent' },
  { k: 'added',    l: 'Date Added' },
  { k: 'az',       l: 'A–Z' },
  { k: 'done',     l: 'Completed' },
];
const EMPTY = { companies: [], courses: [] };

// ══════════════════════════════════════════════
// AES-GCM ENCRYPTION
// ══════════════════════════════════════════════
async function deriveKey(password, salt) {
  const raw = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' },
    raw, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  );
}
async function encrypt(plaintext, password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv   = crypto.getRandomValues(new Uint8Array(12));
  const key  = await deriveKey(password, salt);
  const ct   = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(plaintext));
  const buf  = new Uint8Array(16 + 12 + ct.byteLength);
  buf.set(salt, 0); buf.set(iv, 16); buf.set(new Uint8Array(ct), 28);
  let bin = '', sz = 8192;
  for (let i = 0; i < buf.length; i += sz) bin += String.fromCharCode(...buf.subarray(i, i + sz));
  return btoa(bin);
}
async function decrypt(b64, password) {
  const buf = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const key = await deriveKey(password, buf.slice(0, 16));
  const pt  = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(16, 28) }, key, buf.slice(28));
  return new TextDecoder().decode(pt);
}

// ══════════════════════════════════════════════
// FIREBASE
// ══════════════════════════════════════════════
let _db = null;
function getDb() {
  if (_db) return _db;
  if (!FB_OK) return null;
  try {
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    _db = firebase.firestore();
    return _db;
  } catch(e) { console.error('Firebase init:', e); return null; }
}

async function cloudSave(key, value, pw) {
  const db = getDb(); if (!db) return;
  if (key === 'data') {
    const courseIds = (value.courses || []).map(c => c.id);
    const metaEnc = await encrypt(JSON.stringify({ companies: value.companies, courseIds }), pw);
    const batch = db.batch();
    batch.set(db.collection('cf').doc('meta'), { data: metaEnc, updatedAt: Date.now() });
    for (const course of (value.courses || [])) {
      const enc = await encrypt(JSON.stringify(course), pw);
      batch.set(db.collection('cf').doc('c_' + course.id), { data: enc, updatedAt: Date.now() });
    }
    await batch.commit();
  } else {
    const enc = await encrypt(JSON.stringify(value), pw);
    await db.collection('cf').doc(key).set({ data: enc, updatedAt: Date.now() });
  }
}

async function cloudLoad(key, pw) {
  const db = getDb(); if (!db) return null;
  try {
    if (key === 'data') {
      const snap = await db.collection('cf').doc('meta').get();
      if (!snap.exists) return null;
      const meta = JSON.parse(await decrypt(snap.data().data, pw));
      const courses = await Promise.all((meta.courseIds || []).map(async id => {
        try {
          const s = await db.collection('cf').doc('c_' + id).get();
          if (!s.exists) return null;
          return JSON.parse(await decrypt(s.data().data, pw));
        } catch { return null; }
      }));
      return { companies: meta.companies || [], courses: courses.filter(Boolean) };
    }
    const snap = await db.collection('cf').doc(key).get();
    if (!snap.exists) return null;
    return JSON.parse(await decrypt(snap.data().data, pw));
  } catch(e) {
    if (e?.code) throw e;
    return null;
  }
}

// ══════════════════════════════════════════════
// LOCAL STORAGE
// ══════════════════════════════════════════════
function loadData() {
  try {
    const meta = JSON.parse(localStorage.getItem(META_KEY));
    if (meta?.courseIds) {
      const courses = meta.courseIds.map(id => {
        try { return JSON.parse(localStorage.getItem(COURSE_PFX + id)); } catch { return null; }
      }).filter(Boolean);
      return { companies: meta.companies || [], courses };
    }
    return EMPTY;
  } catch { return EMPTY; }
}

function saveData(d) {
  const saved = [];
  for (const course of (d.courses || [])) {
    try {
      localStorage.setItem(COURSE_PFX + course.id, JSON.stringify(course));
      saved.push(course.id);
    } catch(e) {
      if (localStorage.getItem(COURSE_PFX + course.id)) saved.push(course.id);
    }
  }
  const keep = new Set(saved);
  Object.keys(localStorage).forEach(k => {
    if (k.startsWith(COURSE_PFX) && !keep.has(k.slice(COURSE_PFX.length)))
      localStorage.removeItem(k);
  });
  try { localStorage.setItem(META_KEY, JSON.stringify({ companies: d.companies || [], courseIds: saved })); } catch {}
}

function loadResume() { try { return JSON.parse(localStorage.getItem(RESUME_KEY) || '{}'); } catch { return {}; } }
function saveResume(m) { try { localStorage.setItem(RESUME_KEY, JSON.stringify(m)); } catch {} }

// ══════════════════════════════════════════════
// SYNC MANAGER  ← completely rewritten
// ══════════════════════════════════════════════
// Fixes in this version:
//  1. isSyncing guard prevents concurrent writes entirely
//  2. lastWrite timestamp → isEcho() suppresses own-write Firestore snapshots
//  3. pending always holds the *latest* state; debounce collapses rapid updates
//  4. Exponential backoff retry (1s → 2s → 4s … up to 30s)
//  5. Online listener retries immediately when connection restored
//  6. destroy() prevents any activity after unmount / lock

class SyncManager {
  constructor(db, pw, onStatus) {
    this._db       = db;
    this._pw       = pw;
    this._onStatus = onStatus;
    this._pending  = null;   // { data, resume } – latest to write
    this._timer    = null;
    this._running  = false;  // write in flight
    this._lastWrite = 0;     // ms timestamp of last successful write
    this._retries  = 0;
    this._alive    = true;
    this._status   = 'idle';
  }

  // Call this whenever data or resume changes.
  schedule(data, resume) {
    if (!this._alive || !this._db) return;
    this._pending = { data, resume };
    clearTimeout(this._timer);
    if (this._status !== 'saving') this._emit('pending');
    this._timer = setTimeout(() => this._run(), 800);
  }

  // Force an immediate attempt (e.g. on reconnect).
  flush() {
    if (!this._alive || !this._db || !this._pending) return;
    clearTimeout(this._timer);
    this._run();
  }

  // Returns true if a Firestore snapshot was likely triggered by our own write.
  // The listener should skip processing when this is true.
  isEcho() { return Date.now() - this._lastWrite < 7000; }

  destroy() {
    this._alive = false;
    clearTimeout(this._timer);
  }

  async _run() {
    if (!this._alive) return;

    // Another write is already in flight – re-schedule after it finishes
    if (this._running) {
      this._timer = setTimeout(() => this._run(), 1200);
      return;
    }

    if (!navigator.onLine) {
      this._emit('offline');
      return;
    }

    const snap = this._pending;
    if (!snap) return;

    this._running = true;
    this._emit('saving');

    try {
      await Promise.all([
        cloudSave('data',   snap.data,   this._pw),
        cloudSave('resume', snap.resume, this._pw),
      ]);
      this._lastWrite = Date.now();
      this._retries = 0;
      // Only clear pending if nothing new arrived while we were writing
      if (this._pending === snap) this._pending = null;
      this._emit('saved');
      setTimeout(() => { if (this._alive && this._status === 'saved') this._emit('idle'); }, 2500);
    } catch(err) {
      if (!this._alive) return;
      this._retries = Math.min(this._retries + 1, 6);
      const delay = Math.min(1000 * Math.pow(2, this._retries - 1), 30000);
      this._emit('error');
      this._timer = setTimeout(() => this._run(), delay);
    } finally {
      this._running = false;
    }
  }

  _emit(s) {
    this._status = s;
    if (this._alive) this._onStatus(s);
  }
}

// ══════════════════════════════════════════════
// UTILITIES
// ══════════════════════════════════════════════
const uid     = () => Math.random().toString(36).slice(2, 10);
const haptic  = (t = 'light') => { try { navigator.vibrate?.(t === 'medium' ? [25,15,25] : 40); } catch {} };
const pct     = c => { const t = c.chapters?.length || 0, d = c.chapters?.filter(x => x.completed).length || 0; return t > 0 ? Math.round(d / t * 100) : 0; };
const faviconUrl = url => {
  if (!url) return null;
  try { return `https://www.google.com/s2/favicons?domain=${new URL(url.startsWith('http') ? url : 'https://' + url).hostname}&sz=64`; }
  catch { return null; }
};
const downloadJson = (data, name) => {
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })), download: name });
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
};

// ══════════════════════════════════════════════
// VIDEO PARSING
// ══════════════════════════════════════════════
function parseVideoUrl(url) {
  if (!url) return { type: 'none' };
  const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]+)/);
  if (yt) { const t = url.match(/[?&](?:t|start)=(\d+)/); return { type: 'yt', id: yt[1], start: t ? +t[1] : 0 }; }
  const vm = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if (vm) return { type: 'vimeo', id: vm[1] };
  if (url.includes('drive.google.com') || url.includes('docs.google.com')) {
    const f = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    return f ? { type: 'gdrive', id: f[1] } : { type: 'none' };
  }
  if (url.includes('wistia')) {
    const w = url.match(/(?:medias|iframe)\/([a-zA-Z0-9]+)/);
    return { type: 'wistia', id: w ? w[1] : url.split('/').pop() };
  }
  if (/\.(mp4|webm|mov|m4v|ogg|ogv)(\?|$)/i.test(url)) return { type: 'direct', src: url };
  if (url.startsWith('https')) return { type: 'embed', src: url };
  return { type: 'none' };
}
function buildEmbed(p) {
  switch (p.type) {
    case 'yt':     return `https://www.youtube.com/embed/${p.id}?enablejsapi=1${p.start ? `&start=${p.start}` : ''}&origin=${encodeURIComponent(location.origin)}`;
    case 'vimeo':  return `https://player.vimeo.com/video/${p.id}?title=0&byline=0&portrait=0`;
    case 'gdrive': return `https://drive.google.com/file/d/${p.id}/preview`;
    case 'wistia': return `https://fast.wistia.net/embed/iframe/${p.id}`;
    case 'embed':  return p.src;
    default:       return null;
  }
}

// ══════════════════════════════════════════════
// COMPONENTS
// ══════════════════════════════════════════════

function Toast({ msg }) {
  if (!msg) return null;
  return <div className="toast">{msg}</div>;
}

const CoIcon = React.memo(function CoIcon({ co, size = 26 }) {
  const [err, setErr] = useState(false);
  const src   = co?.icon || faviconUrl(co?.url);
  const color = ACCENT_COLORS[(co?.name || '').charCodeAt(0) % ACCENT_COLORS.length];
  if (src && !err)
    return <img src={src} width={size} height={size} style={{ borderRadius: 5, objectFit: 'contain', flexShrink: 0 }} onError={() => setErr(true)} loading="lazy" />;
  return (
    <div className="co-ico" style={{ width: size, height: size, background: color + '22', color, fontSize: size * .48, flexShrink: 0 }}>
      {(co?.name || '?')[0].toUpperCase()}
    </div>
  );
});

function ProgBar({ done, total, compact }) {
  const p = total > 0 ? Math.round(done / total * 100) : 0;
  return (
    <div className="prog">
      <div className="prog-row">
        <span>{compact ? `${done}/${total}` : `${done}/${total} chapter${total !== 1 ? 's' : ''}`}</span>
        <span>{p}%</span>
      </div>
      <div className="prog-track"><div className="prog-fill" style={{ width: `${p}%` }} /></div>
    </div>
  );
}

function VideoPlayer({ url, vkey, onEnded }) {
  const parsed  = useMemo(() => parseVideoUrl(url), [url]);
  const [ready, setReady] = useState(false);
  useEffect(() => { setReady(false); }, [vkey]);

  useEffect(() => {
    if (parsed.type !== 'yt') return;
    const h = e => {
      try { const d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; if (d?.event === 'onStateChange' && d?.info === 0) onEnded?.(); } catch {}
    };
    window.addEventListener('message', h);
    return () => window.removeEventListener('message', h);
  }, [parsed.type, onEnded]);

  if (parsed.type === 'none') return <div className="video-none"><span style={{ fontSize: 34 }}>▶</span><span>No video URL</span></div>;

  if (parsed.type === 'direct') {
    return (
      <div className="video-wrap">
        <video key={vkey} src={parsed.src} controls controlsList="nodownload" playsInline
          onEnded={onEnded} style={{ width: '100%', height: '100%', display: 'block', background: '#000' }} />
      </div>
    );
  }

  return (
    <div className="video-wrap">
      <div className={`video-overlay ${ready ? 'hide' : ''}`}>
        <div className="video-spin" />
        <span style={{ fontSize: 12, color: 'var(--t3)' }}>Loading…</span>
      </div>
      <iframe key={vkey} src={buildEmbed(parsed)}
        allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
        allowFullScreen onLoad={() => setReady(true)} />
    </div>
  );
}

function ChapterRow({ ch, idx, isActive, onSelect, onEdit, onDelete, mobile }) {
  const sz = mobile ? 30 : 28;
  return (
    <div className={`ch-row ${isActive ? 'active' : ''} ${ch.completed ? 'done' : ''}`} onClick={() => onSelect(idx)}>
      <div className="ch-num">{ch.completed ? '✓' : idx + 1}</div>
      <div className="ch-info">
        <div className="ch-name">{ch.name}</div>
        <div className="ch-meta">
          <span className={`ch-badge ${ch.type === 'video' ? 'video' : 'text'}`}>{ch.type === 'video' ? '▶' : '✦'} {ch.type}</span>
          {ch.duration && <span className="ch-dur">{ch.duration}</span>}
        </div>
      </div>
      <div className="ch-actions" style={mobile ? { opacity: 1 } : {}}>
        <div className="ib" style={{ width: sz, height: sz, fontSize: 11 }} onClick={e => { e.stopPropagation(); onEdit(idx); }}>✏️</div>
        <div className="ib" style={{ width: sz, height: sz, fontSize: 11 }} onClick={e => { e.stopPropagation(); onDelete(idx); }}>🗑️</div>
      </div>
    </div>
  );
}

function ChapterListView({ chapters, activeIdx, onSelect, onEdit, onDelete, mobile }) {
  if (!chapters.length)
    return <div style={{ padding: '28px 16px', color: 'var(--t3)', fontSize: 13, textAlign: 'center', lineHeight: 1.7 }}>No chapters yet.<br />Add your first one below.</div>;

  return chapters.map((ch, i) => {
    const showMod = ch.module && (i === 0 || ch.module !== chapters[i - 1].module);
    return (
      <React.Fragment key={ch.id || i}>
        {showMod && <div className="mod-header">{ch.module}</div>}
        <ChapterRow ch={ch} idx={i} isActive={i === activeIdx} onSelect={onSelect} onEdit={onEdit} onDelete={onDelete} mobile={mobile} />
      </React.Fragment>
    );
  });
}

function CourseModal({ companies, courses, editing, onClose, onSave }) {
  const [title, setTitle]   = useState(editing?.title || '');
  const [thumb, setThumb]   = useState(editing?.thumbnail || '');
  const [coId,  setCoId]    = useState(editing?.companyId || '');
  const [desc,  setDesc]    = useState(editing?.description || '');
  const [newCo, setNewCo]   = useState(false);
  const [nName, setNName]   = useState('');
  const [nUrl,  setNUrl]    = useState('');
  const [nIcon, setNIcon]   = useState('');

  const save = () => { if (!title.trim()) return; onSave('course', { title: title.trim(), thumbnail: thumb.trim(), companyId: coId, description: desc.trim() }); };

  const addCo = () => {
    if (!nName.trim()) return;
    if (companies.some(c => c.name.toLowerCase() === nName.toLowerCase())) { alert('Platform already exists'); return; }
    const co = { id: uid(), name: nName.trim(), url: nUrl.trim(), icon: nIcon.trim() || undefined };
    onSave('addco', co);
    setCoId(co.id); setNewCo(false); setNName(''); setNUrl(''); setNIcon('');
  };

  const delCo = () => {
    if (courses.some(c => c.companyId === coId)) { alert('Cannot delete: platform is used by other courses'); return; }
    onSave('delco', coId); setCoId('');
  };

  return (
    <div className="overlay" onMouseDown={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal">
        <div className="modal-hd"><span className="modal-title">{editing ? 'Edit Course' : 'Add Course'}</span><button className="xb" onClick={onClose}>×</button></div>
        <div className="modal-body">
          <div className="fg"><label className="fl">Course Title *</label>
            <input className="fi" placeholder="e.g. Complete JavaScript Bootcamp" value={title} onChange={e => setTitle(e.target.value)} autoFocus />
          </div>
          <div className="fg"><label className="fl">Thumbnail URL</label>
            <input className="fi" placeholder="https://…" value={thumb} onChange={e => setThumb(e.target.value)} />
          </div>
          <div className="fg"><label className="fl">Platform</label>
            {!newCo ? (
              <div style={{ display: 'flex', gap: 7 }}>
                <select className="fsel" style={{ flex: 1 }} value={coId} onChange={e => setCoId(e.target.value)}>
                  <option value="">— None —</option>
                  {companies.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
                {coId && <button className="btn btn-d btn-sm" onClick={delCo}>🗑️</button>}
                <button className="btn btn-s btn-sm" onClick={() => setNewCo(true)}>+ New</button>
              </div>
            ) : (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 7, padding: 12, background: 'var(--bg2)', borderRadius: 8, border: '1px solid var(--bd)' }}>
                <input className="fi" placeholder="Platform name *" value={nName} onChange={e => setNName(e.target.value)} autoFocus />
                <input className="fi" placeholder="Website URL (for auto favicon)" value={nUrl} onChange={e => setNUrl(e.target.value)} />
                <input className="fi" placeholder="Custom icon URL (optional)" value={nIcon} onChange={e => setNIcon(e.target.value)} />
                <div style={{ display: 'flex', gap: 7 }}>
                  <button className="btn btn-p btn-sm" onClick={addCo} disabled={!nName.trim()}>Add Platform</button>
                  <button className="btn btn-s btn-sm" onClick={() => setNewCo(false)}>Cancel</button>
                </div>
              </div>
            )}
          </div>
          <div className="fg"><label className="fl">Description</label>
            <textarea className="fta" placeholder="Brief overview…" value={desc} onChange={e => setDesc(e.target.value)} />
          </div>
        </div>
        <div className="modal-foot">
          <button className="btn btn-s" onClick={onClose}>Cancel</button>
          <button className="btn btn-p" onClick={save} disabled={!title.trim()}>{editing ? 'Save Changes' : 'Add Course'}</button>
        </div>
      </div>
    </div>
  );
}

function ChapterModal({ chapter, onClose, onSave }) {

  const normF = a => (a || []).map(x => typeof x === 'string' ? { name: x, url: '' } : x);

  const [name,  setName]  = useState(chapter?.name || '');
  const [mod,   setMod]   = useState(chapter?.module || '');
  const [type,  setType]  = useState(chapter?.type || 'video');
  const [dur,   setDur]   = useState(chapter?.duration || '');
  const [vUrl,  setVUrl]  = useState(chapter?.videoUrl || '');
  const [desc,  setDesc]  = useState(chapter?.description || '');
  const [links, setLinks] = useState(norm(chapter?.links));
  const [files, setFiles] = useState(normF(chapter?.files));
  const [tab,   setTab]   = useState('basic');

  const save = () => { if (!name.trim()) return; onSave({ name: name.trim(), module: mod, type, duration: dur, videoUrl: vUrl.trim(), description: desc, links, files }); };
  const upd  = (arr, setFn, i, k, v) => { const a = [...arr]; a[i] = { ...a[i], [k]: v }; setFn(a); };

    <div className="overlay" style={{ zIndex: 1100 }} onMouseDown={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal" style={{ maxWidth: 580 }}>

        <div className="modal-body">
          <div className="tabs">

          {tab === 'basic' && <>
            <div className="fg"><label className="fl">Chapter Name *</label>

            <div className="fg"><label className="fl">Module / Section</label>

              <span className="fi-hint">A heading appears when the module name changes. Leave blank for none.</span>
            </div>
            <div className="fg"><label className="fl">Type</label>
              <div style={{ display: 'flex', gap: 7 }}>
                {['video', 'text'].map(t => <button key={t} className={`btn ${type === t ? 'btn-p' : 'btn-s'}`} style={{ flex: 1 }} onClick={() => setType(t)}>{t === 'video' ? '📹 Video' : '📝 Text'}</button>)}
              </div>
            </div>
            <div className="fg"><label className="fl">Duration (optional)</label>
              <input className="fi" placeholder="e.g. 6:30 or 15 min" value={dur} onChange={e => setDur(e.target.value)} />
            </div>
          </>}

          {tab === 'content' && <>
            {type === 'video' && (
              <div className="fg"><label className="fl">Video URL</label>
                <input className="fi" placeholder="YouTube, Vimeo, Wistia, Google Drive, or any embed URL" value={vUrl} onChange={e => setVUrl(e.target.value)} />
                <span className="fi-hint">Google Drive files must be shared as "Anyone with the link".</span>

            <div className="fg"><label className="fl">Description / Notes</label>
              <textarea className="fta" style={{ minHeight: 120 }} placeholder="Key points, code snippets, notes…" value={desc} onChange={e => setDesc(e.target.value)} />
            </div>
            <div className="fg"><label className="fl">Links</label>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 7 }}>
                {links.map((l, i) => (
                  <div key={i} style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
                    <input className="fi" placeholder="Label" value={l.label || ''} onChange={e => upd(links, setLinks, i, 'label', e.target.value)} />
                    <input className="fi" placeholder="https://…" value={l.url || ''} onChange={e => upd(links, setLinks, i, 'url', e.target.value)} />
                    <button className="btn btn-d btn-sm" onClick={() => setLinks(p => p.filter((_, x) => x !== i))}>×</button>
                  </div>
                ))}
                <button className="btn btn-s btn-sm" style={{ alignSelf: 'flex-start' }} onClick={() => setLinks(p => [...p, { label: '', url: '' }])}>+ Add Link</button>
              </div>

          {tab === 'files' && (
            <div className="fg"><label className="fl">Files</label>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 7 }}>
                {files.map((f, i) => (
                  <div key={i} style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
                    <input className="fi" placeholder="File name" value={f.name || ''} onChange={e => upd(files, setFiles, i, 'name', e.target.value)} />
                    <input className="fi" placeholder="https://…" value={f.url || ''} onChange={e => upd(files, setFiles, i, 'url', e.target.value)} />
                    <button className="btn btn-d btn-sm" onClick={() => setFiles(p => p.filter((_, x) => x !== i))}>×</button>
                  </div>
                ))}
                <button className="btn btn-s btn-sm" style={{ alignSelf: 'flex-start' }} onClick={() => setFiles(p => [...p, { name: '', url: '' }])}>+ Add File</button>

        <div className="modal-foot">
          <button className="btn btn-s" onClick={onClose}>Cancel</button>
          <button className="btn btn-p" onClick={save} disabled={!name.trim()}>Save Chapter</button>
        </div>
      </div>
    </div>
  );
}

function ImportModal({ data, onClose, onImport }) {
  const [err, setErr]   = useState('');
  const [fname, setFname] = useState('');

  const process = raw => {
    try {
      const p = JSON.parse(raw);
      if (!p.courses || !p.companies) { setErr('Invalid format: missing courses or companies.'); return; }

      const nameToId = Object.fromEntries(data.companies.map(c => [c.name.toLowerCase(), c.id]));
      const remap = {};
      const newCos = [];
      p.companies.forEach(ic => {
        const existing = nameToId[ic.name.toLowerCase()];
        if (existing) { remap[ic.id] = existing; }
        else { newCos.push(ic); nameToId[ic.name.toLowerCase()] = ic.id; }
      });

      const remapped = p.courses.map(c => ({ ...c, companyId: remap[c.companyId] || c.companyId }));
      let newCourses = 0, newChapters = 0;

      const updated = data.courses.map(ex => {
        const match = remapped.find(ic =>
          ic.id === ex.id || (ic.title.toLowerCase() === ex.title.toLowerCase() && (ic.companyId || '') === (ex.companyId || ''))
        );
        if (!match) return ex;
        const exIds   = new Set((ex.chapters || []).map(c => c.id));
        const exNames = new Set((ex.chapters || []).map(c => c.name.toLowerCase()));
        const add = (match.chapters || []).filter(c => !exIds.has(c.id) && !exNames.has(c.name.toLowerCase()));
        newChapters += add.length;
        return { ...ex, chapters: [...(ex.chapters || []), ...add] };
      });

      const brandNew = remapped.filter(ic => !data.courses.some(ec =>
        ec.id === ic.id || (ic.title.toLowerCase() === ec.title.toLowerCase() && (ic.companyId || '') === (ec.companyId || ''))
      ));
      newCourses = brandNew.length;

      const parts = [];
      if (newCourses  > 0) parts.push(`${newCourses} new course${newCourses !== 1 ? 's' : ''}`);
      if (newChapters > 0) parts.push(`${newChapters} new chapter${newChapters !== 1 ? 's' : ''}`);
      const msg = parts.length ? `✓ Imported: ${parts.join(', ')}` : '✓ Nothing new to import';
      onImport({ courses: [...updated, ...brandNew], companies: [...data.companies, ...newCos] }, msg);
    } catch { setErr('Could not parse file. Make sure it is a valid CourseFlow JSON backup.'); }
  };

  const onFile = e => { const f = e.target.files[0]; if (!f) return; setFname(f.name); setErr(''); const r = new FileReader(); r.onload = ev => process(ev.target.result); r.readAsText(f); };
  const onDrop = e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (!f) return; setFname(f.name); setErr(''); const r = new FileReader(); r.onload = ev => process(ev.target.result); r.readAsText(f); };

  return (
    <div className="overlay" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal">
        <div className="modal-hd"><span className="modal-title">Import Backup</span><button className="xb" onClick={onClose}>×</button></div>
        <div className="modal-body">
          <div className="fg"><label className="fl">Upload JSON Backup</label>
            <input id="imp-file" type="file" accept=".json" style={{ display: 'none' }} onChange={onFile} />
            <label htmlFor="imp-file" onDrop={onDrop} onDragOver={e => e.preventDefault()}
              style={{ border: '2px dashed var(--bd2)', borderRadius: 10, padding: '26px 20px', textAlign: 'center', cursor: 'pointer', display: 'block', transition: 'border-color .12s' }}>
              <div style={{ fontSize: 13, color: 'var(--t2)', marginBottom: 10 }}>📁 Drag & drop or click to choose</div>
              <span className="btn btn-s btn-sm">Choose File</span>
              {fname && <div style={{ marginTop: 10, fontSize: 12, color: 'var(--ac)' }}>📎 {fname}</div>}
            </label>
          </div>
          {err && <div style={{ color: 'var(--red)', fontSize: 13, background: 'rgba(245,101,101,.08)', padding: '9px 12px', borderRadius: 8, border: '1px solid rgba(245,101,101,.2)' }}>{err}</div>}
        </div>
      </div>
    </div>
  );
}

function HomePage({ data, onUpdate, onOpenCourse, filterCo, setFilterCo, resumeMap, triggerAdd, setTriggerAdd, triggerImport, setTriggerImport }) {
  const [showModal, setShowModal] = useState(false);
  const [editing,   setEditing]   = useState(null);
  const [showImp,   setShowImp]   = useState(false);
  const [search,    setSearch]    = useState('');
  const [sortBy,    setSortBy]    = useState('recent');
  const [menuOpen,  setMenuOpen]  = useState(null);
  const [toast,     setToast]     = useState('');

  useEffect(() => { if (triggerAdd) { setEditing(null); setShowModal(true); setTriggerAdd(false); } }, [triggerAdd]);
  useEffect(() => { if (triggerImport) { setShowImp(true); setTriggerImport(false); } }, [triggerImport]);
  useEffect(() => {
    const h = e => { if (!e.target.closest('.card-menu-btn')) setMenuOpen(null); };
    window.addEventListener('click', h);
    return () => window.removeEventListener('click', h);
  }, []);

  const showToast = msg => { setToast(msg); setTimeout(() => setToast(''), 2800); };

  const { companies, courses } = data;
  const coMap = useMemo(() => Object.fromEntries(companies.map(c => [c.id, c])), [companies]);
  const visibleCos = useMemo(() => companies.filter(co => courses.some(c => c.companyId === co.id)), [companies, courses]);

  const displayed = useMemo(() => {
    const q = search.toLowerCase();
    let list = courses.filter(c => {
      const matchCo = filterCo === 'all' || c.companyId === filterCo;
      const matchQ  = !q || c.title.toLowerCase().includes(q);
      return matchCo && matchQ;
    });
    if (sortBy === 'az')     list = [...list].sort((a, b) => a.title.localeCompare(b.title));
    if (sortBy === 'done')   list = list.filter(c => pct(c) === 100);
    if (sortBy === 'recent') list = [...list].sort((a, b) => (b.lastAccessed || 0) - (a.lastAccessed || 0));
    return list;
  }, [courses, filterCo, search, sortBy]);

  const handleModal = (type, payload) => {
    if (type === 'addco') { onUpdate({ ...data, companies: [...companies, payload] }); return; }
    if (type === 'delco') { onUpdate({ ...data, companies: companies.filter(c => c.id !== payload) }); return; }
    if (type === 'course') {
      const crs = editing
        ? courses.map(c => c.id === editing.id ? { ...c, ...payload } : c)
        : [...courses, { id: uid(), ...payload, chapters: [], createdAt: Date.now() }];
      onUpdate({ ...data, courses: crs });
      setShowModal(false); setEditing(null);
    }
  };

  const deleteCourse = (id, e) => {
    e.stopPropagation();
    const c = courses.find(x => x.id === id);
    if (!confirm(`Delete "${c?.title}"? This cannot be undone.`)) return;
    const remaining = courses.filter(x => x.id !== id);
    const usedCos   = new Set(remaining.map(x => x.companyId).filter(Boolean));
    onUpdate({ ...data, courses: remaining, companies: companies.filter(co => usedCos.has(co.id)) });
    setMenuOpen(null);
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', overflow: 'hidden' }}>
      <div className="topbar">
        <span className="topbar-title">Course<span>Flow</span></span>
        <div className="si-wrap" style={{ flex: 1, maxWidth: 240 }}>
          <span className="si-ico">🔍</span>
          <input className="fi si" placeholder="Search courses…" value={search} onChange={e => setSearch(e.target.value)} style={{ height: 34 }} />
        </div>
        <button className="btn btn-s btn-sm desktop-only" onClick={() => setShowImp(true)}>📥 Import</button>
        <button className="btn btn-s btn-sm desktop-only" onClick={() => downloadJson({ companies, courses }, `courseflow-${new Date().toISOString().slice(0, 10)}.json`) || showToast('✓ Backup downloaded')}>💾 Export</button>
        <button className="btn btn-p desktop-only" onClick={() => { setEditing(null); setShowModal(true); }}>+ Add Course</button>
      </div>

      <div className="content">
        {visibleCos.length > 0 && (
          <div className="chips">
            <div className={`chip ${filterCo === 'all' ? 'on' : ''}`} onClick={() => setFilterCo('all')}>⬡ All ({courses.length})</div>
            {visibleCos.map(co => (
              <div key={co.id} className={`chip ${filterCo === co.id ? 'on' : ''}`} onClick={() => setFilterCo(filterCo === co.id ? 'all' : co.id)}>
                <CoIcon co={co} size={14} /> {co.name} ({courses.filter(c => c.companyId === co.id).length})
              </div>
            ))}
          </div>
        )}

        <div className="sh">
          <div>
            <span className="sh-title">{filterCo === 'all' ? 'All Courses' : (coMap[filterCo]?.name || 'Courses')}</span>
            <span className="sh-count">{displayed.length} course{displayed.length !== 1 ? 's' : ''}</span>
          </div>
          <div className="sort-row">
            {SORTS.map(s => <button key={s.k} className={`sk ${sortBy === s.k ? 'on' : ''}`} onClick={() => setSortBy(s.k)}>{s.l}</button>)}
          </div>
        </div>

        {displayed.length === 0 ? (
          <div className="empty">
            <div className="empty-ico">📚</div>
            <div className="empty-title">{courses.length === 0 ? 'No courses yet' : 'No courses found'}</div>
            <div className="empty-sub">{courses.length === 0 ? 'Start by adding your first course.' : 'Try adjusting your search or filter.'}</div>
            {courses.length === 0 && <button className="btn btn-p" onClick={() => setShowModal(true)}>Add Your First Course</button>}
          </div>
        ) : (
          <div className="grid">
            {displayed.map((course, i) => {
              const co       = coMap[course.companyId];
              const chs      = course.chapters || [];
              const rIdx     = resumeMap[course.id] ?? 0;
              const hasResume = Object.prototype.hasOwnProperty.call(resumeMap, course.id);
              const resumeName = chs[rIdx]?.name;
              return (
                <div key={course.id} className="card" onClick={() => onOpenCourse(course.id)}>
                  <div className="card-menu-btn" onClick={e => e.stopPropagation()}>
                    <div className="ib" style={{ fontSize: 10, letterSpacing: 2 }} onClick={() => setMenuOpen(menuOpen === course.id ? null : course.id)}>•••</div>
                    {menuOpen === course.id && (
                      <div className="card-dropdown">
                        <div className="card-ddi" onClick={() => { setEditing(course); setShowModal(true); setMenuOpen(null); }}>✏️ Edit</div>
                        <div className="card-ddi danger" onClick={e => deleteCourse(course.id, e)}>🗑️ Delete</div>
                      </div>
                    )}
                  </div>
                  {course.thumbnail ? (
                    <div className="card-thumb">
                      <img src={course.thumbnail} alt={course.title} loading="lazy"
                        onError={e => { e.target.style.display = 'none'; e.target.nextSibling.style.display = 'flex'; }} />
                      <div style={{ display: 'none' }} className={`card-ph g${i % 6}`}>📖</div>
                      {co        && <div className="card-badge"><CoIcon co={co} size={18} /></div>}
                      {hasResume && <div className="card-resume">▶ Resume</div>}
                    </div>
                  ) : (
                    <div className={`card-ph g${i % 6}`}>
                      <span>📖</span>
                      {co        && <div className="card-badge"><CoIcon co={co} size={18} /></div>}
                      {hasResume && <div className="card-resume">▶ Resume</div>}
                    </div>
                  )}
                  <div className="card-body">
                    <div className="card-name">{course.title}</div>
                    {hasResume && resumeName
                      ? <div className="card-desc" style={{ color: 'var(--ac)', opacity: .85 }}>▶ Continue: {resumeName}</div>
                      : course.description && <div className="card-desc">{course.description}</div>
                    }
                    <ProgBar done={chs.filter(c => c.completed).length} total={chs.length} />
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {showModal && <CourseModal companies={companies} courses={courses} editing={editing} onClose={() => { setShowModal(false); setEditing(null); }} onSave={handleModal} />}
      {showImp    && <ImportModal data={data} onClose={() => setShowImp(false)} onImport={(d, msg) => { onUpdate(d); setShowImp(false); showToast(msg); }} />}
      <Toast msg={toast} />
    </div>
  );
}

function NotesPage({ data, onOpenCourse }) {
  const [search, setSearch] = useState('');
  const q = search.trim().toLowerCase();

  const { all, filtered } = useMemo(() => {
    const all = [];
    data.courses.forEach(course => {
      (course.chapters || []).forEach((ch, idx) => {
        if (ch.notes?.trim()) all.push({ course, chapter: ch, idx });
      });
    });
    return { all, filtered: q ? all.filter(n => n.chapter.notes.toLowerCase().includes(q) || n.chapter.name.toLowerCase().includes(q) || n.course.title.toLowerCase().includes(q)) : all };
  }, [data.courses, q]);

  const hl = txt => {
    if (!q) return txt;
    const lo = txt.toLowerCase(), i = lo.indexOf(q);
    if (i < 0) return txt;
    return <>{txt.slice(0, i)}<mark>{txt.slice(i, i + q.length)}</mark>{txt.slice(i + q.length)}</>;
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', overflow: 'hidden' }}>
      <div className="topbar">
        <span className="topbar-title">📓 <span>My Notes</span></span>
        <div className="si-wrap" style={{ flex: 1, maxWidth: 240 }}>
          <span className="si-ico">🔍</span>
          <input className="fi si" placeholder="Search notes…" value={search} onChange={e => setSearch(e.target.value)} style={{ height: 34 }} />
        </div>
      </div>
      <div className="content">
        {all.length === 0
          ? <div className="empty"><div className="empty-ico">📓</div><div className="empty-title">No notes yet</div><div className="empty-sub">Open any course chapter and start writing — all notes appear here.</div></div>
          : filtered.length === 0
            ? <div className="empty"><div className="empty-ico">🔍</div><div className="empty-title">No matches</div><div className="empty-sub">No notes match "{search}".</div></div>
            : <>
                <div style={{ marginBottom: 14, fontSize: 12.5, color: 'var(--t3)' }}>{filtered.length} note{filtered.length !== 1 ? 's' : ''}{q ? ` matching "${search}"` : ''} — click to jump</div>
                <div className="notes-grid">
                  {filtered.map(({ course, chapter, idx }) => (
                    <div key={`${course.id}-${idx}`} className="note-card" onClick={() => onOpenCourse(course.id, idx, true)}>
                      <div className="note-co">{course.title}</div>
                      <div className="note-ch">Ch.{idx + 1} — {chapter.name}</div>
                      <div className="note-preview">{hl(chapter.notes)}</div>
                    </div>
                  ))}
                </div>
              </>
        }
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════
// COURSE PAGE
// ══════════════════════════════════════════════
function CoursePage({ courseId, data, onUpdate, onBack, resumeMap, onResumeUpdate, mobileChaptersOpen, setMobileChaptersOpen, mobileNotesOpen, setMobileNotesOpen, initIdx, onIdxChange }) {
  const course  = useMemo(() => data.courses.find(c => c.id === courseId), [data.courses, courseId]);
  const co      = useMemo(() => data.companies.find(c => c.id === course?.companyId), [data.companies, course?.companyId]);
  const chapters = course?.chapters || [];

  // We keep a ref to the latest data so callbacks don't capture stale closure
  const dataRef = useRef(data);
  useEffect(() => { dataRef.current = data; }, [data]);

  const [activeIdx, setActiveIdx] = useState(initIdx ?? 0);
  const [vKey,      setVKey]      = useState(0);
  const [showNotes, setShowNotes] = useState(false);
  const [showChMod, setShowChMod] = useState(false);
  const [editIdx,   setEditIdx]   = useState(null);
  const [noteLocal, setNoteLocal] = useState('');
  const [noteSaved, setNoteSaved] = useState(false);
  const [popAnim,   setPopAnim]   = useState(false);
  const noteTimer  = useRef(null);
  const notePersist = useRef(null);

  // Sync initIdx from parent (e.g. coming from notes page)
  useEffect(() => {
    if (initIdx !== undefined && initIdx !== activeIdx) {
      setActiveIdx(initIdx);
      setVKey(k => k + 1);
    }
  }, [initIdx]);

  // Keep noteLocal in sync with the current chapter's saved notes
  useEffect(() => {
    const ch = chapters[activeIdx];
    setNoteLocal(ch?.notes || '');
    setNoteSaved(false);
  }, [courseId, activeIdx]);

  if (!course) return null;

  const chapter   = chapters[activeIdx];
  const doneCount = chapters.filter(c => c.completed).length;

  const updateCourse = useCallback(updated => {
    const next = { ...dataRef.current, courses: dataRef.current.courses.map(c => c.id === courseId ? updated : c) };
    onUpdate(next);
  }, [courseId, onUpdate]);

  const goTo = useCallback(idx => {
    setActiveIdx(idx);
    setVKey(k => k + 1);
    const nm = { ...resumeMap, [courseId]: idx };
    onResumeUpdate(nm);
    onIdxChange?.(idx);
  }, [resumeMap, courseId, onResumeUpdate, onIdxChange]);

  const markDone = useCallback((force) => {
    if (!chapter) return;
    const will = force !== undefined ? force : !chapter.completed;
    updateCourse({ ...course, chapters: chapters.map((c, i) => i === activeIdx ? { ...c, completed: will } : c) });
    if (will) { haptic('medium'); setPopAnim(true); setTimeout(() => setPopAnim(false), 400); }
    else haptic();
  }, [chapter, chapters, activeIdx, course, updateCourse]);

  // Notes: update local state immediately, debounce the actual save
  const onNoteChange = useCallback(val => {
    setNoteLocal(val);
    setNoteSaved(false);
    clearTimeout(noteTimer.current);
    noteTimer.current = setTimeout(() => {
      const d = dataRef.current;
      const c = d.courses.find(x => x.id === courseId);
      if (!c) return;
      const chs = c.chapters.map((ch, i) => i === activeIdx ? { ...ch, notes: val } : ch);
      onUpdate({ ...d, courses: d.courses.map(x => x.id === courseId ? { ...c, chapters: chs } : x) });
      setNoteSaved(true);
      clearTimeout(notePersist.current);
      notePersist.current = setTimeout(() => setNoteSaved(false), 2500);
    }, 900);
  }, [courseId, activeIdx, onUpdate]);

  useEffect(() => () => { clearTimeout(noteTimer.current); clearTimeout(notePersist.current); }, []);

  const saveChapter = useCallback(chData => {
    if (editIdx !== null) {
      updateCourse({ ...course, chapters: chapters.map((c, i) => i === editIdx ? { ...c, ...chData } : c) });
    } else {
      const ch = { id: uid(), ...chData, completed: false, notes: '' };
      const at = chapters.length > 0 ? activeIdx + 1 : 0;
      const nc = [...chapters.slice(0, at), ch, ...chapters.slice(at)];
      updateCourse({ ...course, chapters: nc });
      goTo(at);
    }
    setShowChMod(false); setEditIdx(null);
  }, [chapters, editIdx, activeIdx, course, updateCourse, goTo]);

  const deleteChapter = useCallback(idx => {
    if (!confirm('Delete this chapter?')) return;
    const nc = chapters.filter((_, i) => i !== idx);
    updateCourse({ ...course, chapters: nc });
    if (activeIdx >= nc.length) goTo(Math.max(0, nc.length - 1));
  }, [chapters, activeIdx, course, updateCourse, goTo]);

  const notesContent = (
    <>
      <div className="notes-hd">
        <span className="notes-label">📓 Notes</span>
        <span className="notes-ch-name">{chapter?.name}</span>
      </div>
      <div className="notes-body">
        <textarea className="notes-ta"
          placeholder={`Notes for "${chapter?.name || 'this chapter'}"…\n\nKey points, questions, code snippets.`}
          value={noteLocal}
          onChange={e => onNoteChange(e.target.value)}
          disabled={!chapter}
        />
        <div className={`notes-saved ${noteSaved ? 'show' : ''}`}>✓ Saved</div>
      </div>
    </>
  );

  // Inline sidebar content (shared between desktop sidebar and mobile overlay)
  const sidebarContent = (
    <>
      <div className="course-sidebar-hd">
        <button className="btn btn-s btn-sm" onClick={() => { onBack(); setMobileChaptersOpen?.(false); }} style={{ marginBottom: 10 }}>← Back</button>
        <div className="sidebar-label">Course Index</div>
        <div className="sidebar-course-title">{course.title}</div>
        <ProgBar done={doneCount} total={chapters.length} compact />
      </div>
      <div className="chapter-list">
        <ChapterListView chapters={chapters} activeIdx={activeIdx}
          onSelect={i => { goTo(i); setMobileChaptersOpen?.(false); }}
          onEdit={i => { setEditIdx(i); setShowChMod(true); }}
          onDelete={deleteChapter}
          mobile={!!setMobileChaptersOpen} />
      </div>
      <div className="sidebar-add">
        <button className="btn btn-s" style={{ width: '100%', justifyContent: 'center' }} onClick={() => { setEditIdx(null); setShowChMod(true); }}>+ Add Chapter</button>
      </div>
    </>
  );

  return (
    <div className="course-layout">
      {/* Desktop sidebar */}
      <div className="course-sidebar">{sidebarContent}</div>

      {/* Main content */}
      <div className="course-main">
        <div className="course-topbar">
          {co && <CoIcon co={co} size={20} />}
          <div className="course-topbar-title">{chapter?.name || 'Select a chapter'}</div>
          {chapter && (
            <div style={{ display: 'flex', alignItems: 'center', gap: 7, flexShrink: 0 }}>
              <button className="btn btn-s btn-sm" disabled={activeIdx === 0} onClick={() => goTo(activeIdx - 1)}
                style={{ opacity: activeIdx === 0 ? .4 : 1 }}>← Prev</button>
              {activeIdx < chapters.length - 1 ? (
                <button className={`btn btn-sm ${chapter.completed ? 'btn-s' : 'btn-p'}`}
                  onClick={() => { if (!chapter.completed) markDone(true); goTo(activeIdx + 1); }}>
                  {chapter.completed ? 'Next →' : '✓ Complete & Next'}
                </button>
              ) : (
                <button className={`mark-btn ${chapter.completed ? 'done' : ''} ${popAnim ? 'pop' : ''}`} onClick={() => markDone()}>
                  <div className="cb">{chapter.completed ? '✓' : ''}</div>
                  {chapter.completed ? 'Completed' : 'Mark Complete'}
                </button>
              )}
            </div>
          )}
          <button className="btn btn-s btn-sm desktop-only" onClick={() => setShowNotes(v => !v)}>
            {showNotes ? '⊟ Hide Notes' : '📓 Notes'}
          </button>
        </div>

        <div className="course-body">
          <div className="course-content">
            {!chapter ? (
              <div className="empty" style={{ padding: '56px 20px' }}>
                <div className="empty-ico">📖</div>
                <div className="empty-title">No chapters yet</div>
                <div className="empty-sub">Add chapters to start building your course content.</div>
                <button className="btn btn-p" onClick={() => { setEditIdx(null); setShowChMod(true); }}>Add First Chapter</button>
              </div>
            ) : (
              <>
                {chapter.type === 'video' && (
                  chapter.videoUrl
                    ? <VideoPlayer url={chapter.videoUrl} vkey={`${courseId}-${activeIdx}-${vKey}`}
                        onEnded={() => { if (!chapter.completed) markDone(true); if (activeIdx < chapters.length - 1) setTimeout(() => goTo(activeIdx + 1), 700); }} />
                    : <div className="video-none">
                        <span style={{ fontSize: 34 }}>▶</span>
                        <span>No video URL set</span>
                        <button className="btn btn-s btn-sm" onClick={() => { setEditIdx(activeIdx); setShowChMod(true); }}>Add Video URL</button>
                      </div>
                )}
                {chapter.description && (
                  <div className="block"><div className="block-title">📋 Description</div><div className="block-text">{chapter.description}</div></div>
                )}
                {(chapter.links?.length > 0) && (
                  <div className="block"><div className="block-title">🔗 Resources</div>
                    <div className="link-list">
                      {chapter.links.map((l, i) => { const lk = typeof l === 'string' ? { label: l, url: l } : l; return <a key={i} href={lk.url} target="_blank" rel="noopener noreferrer" className="link-item">🔗 {lk.label || lk.url}</a>; })}
                    </div>
                  </div>
                )}
                {(chapter.files?.length > 0) && (
                  <div className="block"><div className="block-title">📁 Files</div>
                    <div className="file-list">
                      {chapter.files.map((f, i) => { const fi = typeof f === 'string' ? { name: f, url: '' } : f; return <a key={i} href={fi.url || '#'} target="_blank" rel="noopener noreferrer" className="file-item" style={{ cursor: fi.url ? 'pointer' : 'default' }}><span style={{ fontSize: 18 }}>📄</span><span className="file-name">{fi.name || fi.url}</span></a>; })}
                    </div>
                  </div>
                )}
                {chapter.type === 'text' && !chapter.description && !chapter.links?.length && !chapter.files?.length && (
                  <div className="block" style={{ textAlign: 'center', padding: '36px 20px', color: 'var(--t3)' }}>
                    <div style={{ fontSize: 30, marginBottom: 10 }}>📝</div>
                    <div style={{ fontSize: 13 }}>No content yet.</div>
                    <button className="btn btn-s btn-sm" style={{ marginTop: 12 }} onClick={() => { setEditIdx(activeIdx); setShowChMod(true); }}>Add Content</button>
                  </div>
                )}
              </>
            )}
          </div>

          {/* Desktop notes panel */}
          <div className={`notes-panel ${showNotes ? '' : 'hidden'}`}>
            {showNotes && notesContent}
          </div>
        </div>
      </div>

      {/* Mobile: chapters slide-in */}
      <div className={`m-sidebar ${mobileChaptersOpen ? 'open' : ''}`}>
        <div className="m-sidebar-bk" onClick={() => setMobileChaptersOpen(false)} />
        <div className="m-sidebar-panel">{sidebarContent}</div>
      </div>

      {/* Mobile: notes bottom sheet */}
      <div className={`m-sheet ${mobileNotesOpen ? 'open' : ''}`}>
        <div className="m-sheet-bk" onClick={() => setMobileNotesOpen(false)} />
        <div className="m-sheet-panel">
          <div className="m-sheet-handle" />
          <div style={{ display: 'flex', flexDirection: 'column', flex: 1, overflow: 'hidden' }}>{notesContent}</div>
        </div>
      </div>

      {showChMod && (
        <ChapterModal chapter={editIdx !== null ? chapters[editIdx] : null}
          onClose={() => { setShowChMod(false); setEditIdx(null); }} onSave={saveChapter} />
      )}
    </div>
  );
}
